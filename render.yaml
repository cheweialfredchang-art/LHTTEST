services:
  - type: web
    name: ykvs-ai-assistant
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: PYTHON_BIN
        value: python3
      - key: MAX_AGENT_STEPS
        value: '4'
