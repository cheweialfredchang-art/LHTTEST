<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>V9 管理儀表板</title><style>body{font:16px system-ui;max-width:900px;margin:35px auto;padding:18px;background:#f7fafc;color:#17233c}input,button{padding:10px;border:1px solid #bbb;border-radius:7px}pre{background:white;border:1px solid #ddd;border-radius:10px;padding:20px;white-space:pre-wrap}</style><h1>V9 Agent 執行紀錄</h1><p>僅顯示匿名化指標，不包含學生提問或個人資料。資料預設僅在目前程序記憶體保留。</p><input id="token" type="password" placeholder="ADMIN_TOKEN"><button onclick="load()">讀取統計</button><pre id="out">請輸入管理金鑰</pre><script>async function load(){const r=await fetch('/api/admin/metrics',{headers:{'x-admin-token':document.getElementById('token').value}});document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2)}</script></html>
